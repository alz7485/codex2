name: Funnel Cursor ZIP Build

on:
  push:
    branches:
      - "build/funnel-cursor-v1.4.0-*"
      - "build/funnel-cursor-v1.5.0-*"
      - "build/funnel-cursor-v1.6.0-*"
      - "build/funnel-cursor-v1.6.1-*"
      - "build/funnel-cursor-v1.6.2-*"
      - "build/funnel-cursor-v1.6.3-*"
      - "build/funnel-cursor-v1.7.0-*"
      - "build/funnel-cursor-v1.7.1-*"
      - "build/funnel-cursor-v1.8.0-*"
      - "build/funnel-cursor-v1.9.0-*"

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'Build latest funnel cursor ZIP')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/funnel-cursor-switcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Download software OpenGL fallback
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/25.0.7/mesa3d-25.0.7-release-msvc.7z' -OutFile mesa.7z
          7z x mesa.7z -omesa-download -y
      - name: Build Windows ZIP
        shell: cmd
        run: build-onedir.cmd
      - name: Check catalog, editor, and effects
        shell: cmd
        run: .venv-build\Scripts\python.exe -m unittest -v test_catalog test_effects test_idle_motion test_editor test_trial58
      - name: Verify extracted Windows app and cursor restore
        shell: cmd
        run: .venv-build\Scripts\python.exe verify_windows_release.py dist/FunnelCursorSwitcher-windows-x64.zip --check-system-restore
      - name: Package minimal runtime
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("dist/FunnelCursorSwitcher")
          archive = Path("dist/FunnelCursorSwitcher-v1.9.0-lite-windows-x64.zip")
          with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root)
                  if rel.parts[0] not in ("_internal", "カーソル", "飛行アニメ", "VERSION", "FunnelCursorSwitcher.exe"):
                      continue
                  if "__pycache__" in rel.parts or ("licenses" not in rel.parts and p.suffix.lower() in (".md", ".gif", ".blend", ".obj", ".html")):
                      continue
                  if p.name.startswith("test_") or p.name.startswith("verify_"):
                      continue
                  z.write(p, str(Path("FunnelCursorSwitcher") / rel))
          print(archive, archive.stat().st_size)
      - name: Verify minimal runtime
        shell: cmd
        run: .venv-build\Scripts\python.exe verify_windows_release.py dist/FunnelCursorSwitcher-v1.9.0-lite-windows-x64.zip --check-system-restore
      - name: Upload lightweight ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FunnelCursorSwitcher-v1.9.0-lite-windows-x64
          path: tools/funnel-cursor-switcher/dist/FunnelCursorSwitcher-v1.9.0-lite-windows-x64.zip
          compression-level: 0
          if-no-files-found: error

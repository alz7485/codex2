name: Cursor UI Screenshots
on:
  push:
    branches: ["preview/funnel-ui-*"]
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    env:
      VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow
    defaults:
      run:
        working-directory: tools/funnel-cursor-switcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare rendering dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/25.0.7/mesa3d-25.0.7-release-msvc.7z' -OutFile mesa.7z
          7z x mesa.7z -omesa-download -y
          python prepare_mesa.py
      - name: Capture five settings windows
        shell: cmd
        run: python capture_current_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cursor-UI-v1.9.0
          path: tools/funnel-cursor-switcher/ui-screenshots/*.png
